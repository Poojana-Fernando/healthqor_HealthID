# Netlify build settings — auto-deploys on every push to main when the site
# is linked to GitHub at https://app.netlify.com

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router SPA — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
