spring.application.name=healthid

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:healthid}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:redis}

# Security & encryption
healthid.encryption.key=${HEALTHID_ENCRYPTION_KEY}
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Admin bootstrap (first run only when no ADMIN exists)
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
admin.bootstrap.name=${ADMIN_NAME:System Admin}

# Email verification (Brevo)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:HealthID}
email.otp-expiry-minutes=${EMAIL_OTP_EXPIRY_MINUTES:15}
email.reverify-days=${EMAIL_REVERIFY_DAYS:30}
email.resend-cooldown-seconds=${EMAIL_RESEND_COOLDOWN_SECONDS:60}
email.max-sends-per-hour=${EMAIL_MAX_SENDS_PER_HOUR:3}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/google/callback

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini

# Actuator
management.endpoints.web.exposure.include=health,info

# SpringDoc (enabled in dev, disabled in prod via profile)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
