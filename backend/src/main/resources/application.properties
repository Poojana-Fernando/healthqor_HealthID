spring.application.name=healthid

# Cloud hosts (Render, Railway, Fly.io) inject PORT
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:healthid}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:redis}

# Security & encryption
healthid.encryption.key=${HEALTHID_ENCRYPTION_KEY}
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Demo patient health data (vaccinations, medical history) — enabled in dev profile
health.seed.patient-data.enabled=${HEALTH_SEED_PATIENT_DATA:false}

# Admin bootstrap (first run only when no ADMIN exists)
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
admin.bootstrap.name=${ADMIN_NAME:System Admin}

# Email verification (Brevo)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:HealthID}
email.otp-expiry-minutes=${EMAIL_OTP_EXPIRY_MINUTES:15}
email.reverify-days=${EMAIL_REVERIFY_DAYS:30}
email.resend-cooldown-seconds=${EMAIL_RESEND_COOLDOWN_SECONDS:60}
email.max-sends-per-hour=${EMAIL_MAX_SENDS_PER_HOUR:3}

# Phone verification (Twilio SMS)
phone.sms.provider=${PHONE_SMS_PROVIDER:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
phone.otp-expiry-minutes=${PHONE_OTP_EXPIRY_MINUTES:15}
phone.resend-cooldown-seconds=${PHONE_RESEND_COOLDOWN_SECONDS:60}
phone.max-sends-per-hour=${PHONE_MAX_SENDS_PER_HOUR:3}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/google/callback

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini
openai.api.chat.temperature=0.35
openai.api.chat.max-tokens=900

# Actuator
management.endpoints.web.exposure.include=health,info

# SpringDoc (enabled in dev, disabled in prod via profile)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
