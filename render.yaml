# Render Blueprint — deploy backend from repo root via Dashboard → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec
# Render has no native Java runtime; use Docker (see backend/Dockerfile).
services:
  - type: web
    name: healthid-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CACHE_TYPE
        value: simple
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: healthid
      - key: HEALTHID_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: System Admin
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: HealthID
      # Phone verification (Twilio SMS) — set PHONE_SMS_PROVIDER=twilio and fill TWILIO_* for live OTP
      - key: PHONE_SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PHONE_OTP_EXPIRY_MINUTES
        value: "15"
      - key: PHONE_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: PHONE_MAX_SENDS_PER_HOUR
        value: "3"
